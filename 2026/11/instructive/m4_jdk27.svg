<text x="30" y="36" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1f2933">JDK 27 on Apple M4: two words at a time, in 128-bit vector registers</text>
<text x="270" y="101.0" text-anchor="end" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="bold" font-style="normal" fill="#1f2933">ldr q</text>
<text x="710" y="101.0" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#6b7785">load a[k], a[k+1]</text>
